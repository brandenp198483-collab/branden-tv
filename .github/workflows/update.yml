name: Update BrandenTV Playlist

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Build playlist
        run: |
          python build_playlist.py
          mkdir -p docs
          cp output/BrandenTV.m3u docs/BrandenTV.m3u
          cp output/premium_watchlist_matches.txt docs/premium_watchlist_matches.txt

      - name: Commit updated playlist
        run: |
          git config user.name "BrandenTV Bot"
          git config user.email "actions@github.com"
          git add output/BrandenTV.m3u output/premium_watchlist_matches.txt docs/BrandenTV.m3u docs/premium_watchlist_matches.txt
          git commit -m "Auto update playlist" || echo "No changes to commit"
          git push
